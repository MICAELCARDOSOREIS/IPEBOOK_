appId: com.ipebook.app
name: Leitor ISBN pela câmera e permissão de fotos ao anunciar (Android)
tags:
  - android
  - camera
  - hardware-nativo
---
- launchApp:
    stopApp: false
# Pré-condição: sessão autenticada no app Android
- tapOn: "Início"
- assertVisible:
    id: "home-floating-add-button"
- tapOn:
    id: "home-floating-add-button"
- assertVisible: "Anunciar livro"
- tapOn: "Abrir leitor de código de barras pela câmera"
- runFlow:
    when:
      visible: "Durante o uso do app"
    commands:
      - tapOn: "Durante o uso do app"
- runFlow:
    when:
      visible: "Ao usar o app"
    commands:
      - tapOn: "Ao usar o app"
- runFlow:
    when:
      visible: "Permitir"
    commands:
      - tapOn: "Permitir"
- assertVisible: "Escanear ISBN"
- tapOn: "Fechar leitor de código de barras"
- tapOn:
    text: "Título"
    optional: true
- runFlow:
    when:
      visible: "Limpar rascunho"
    commands:
      - tapOn: "Limpar rascunho"
- tapOn: "Título"
- inputText: "Livro Teste Maestro"
- hideKeyboard
- tapOn: "Autor"
- inputText: "Autor Maestro"
- hideKeyboard
- tapOn: "Modalidade Doação"
- tapOn: "Continuar"
- assertVisible: "Mostre seu livro."
- tapOn: "Foto da capa"
- assertVisible: "Tirar foto"
- tapOn: "Tirar foto"
- runFlow:
    when:
      visible: "Fotos do seu livro"
    commands:
      - assertVisible: "Permitir e escolher"
      - tapOn: "Publicar sem foto"
- tapOn: "Voltar à etapa anterior"
- runFlow:
    when:
      visible: "Limpar rascunho"
    commands:
      - tapOn: "Limpar rascunho"
- back
- assertVisible:
    id: "home-floating-add-button"
