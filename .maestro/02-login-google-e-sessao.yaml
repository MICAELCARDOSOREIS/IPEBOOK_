appId: com.ipebook.app
name: Fluxo nativo de login com Google no Android
tags:
  - android
  - auth
  - hardware-nativo
---
- launchApp
- runFlow:
    when:
      visible: "Já tenho conta"
    commands:
      - tapOn: "Já tenho conta"
- assertVisible: "Continuar com Google"
- tapOn: "Continuar com Google"
# O seletor nativo de contas Google (Play Services) é exibido fora do processo do app.
# Em ambiente interativo, selecione a conta de teste configurada no aparelho.
- waitForAnimationToEnd
